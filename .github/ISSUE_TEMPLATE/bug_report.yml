name: Bug report
description: Report a reproducible problem with the plugin
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. Do not include secrets or private session data.
  - type: input
    id: version
    attributes:
      label: Plugin version
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the smallest reproducible example you can.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Node.js, pnpm, DSH, Cordis, browser, and operating system versions.
    validations:
      required: true
